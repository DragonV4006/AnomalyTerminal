<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Retro Terminal OS</title>
<style>
:root{--bg:#020603;--panel:#071008;--green:#8cff9c;--dim:#4e8c59;--line:#1c4b27;--bright:#c5ffd0;--amber:#d5c477}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#000;font-family:"Cascadia Mono","Consolas","Courier New",monospace}

/* --- АНИМАЦИИ МОНИТОРА --- */
#screen-flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 10000; }
#crt-overlay { position: fixed; inset: 0; background: #000; z-index: 9999; opacity: 0; pointer-events: none; display: flex; align-items: center; justify-content: center; }
#crt-line { width: 100%; height: 2px; background: #fff; opacity: 0; box-shadow: 0 0 15px #fff; }

@keyframes turnOn {
  0% { transform: scaleY(0.01) scaleX(0.5); opacity: 1; filter: brightness(3); }
  30% { transform: scaleY(0.01) scaleX(1); opacity: 1; filter: brightness(3); }
  100% { transform: scaleY(1) scaleX(1); opacity: 0; filter: brightness(1); }
}
@keyframes turnOff {
  0% { transform: scaleY(1) scaleX(1); opacity: 1; filter: brightness(1); }
  60% { transform: scaleY(0.01) scaleX(1); opacity: 1; filter: brightness(3); }
  100% { transform: scaleY(0.01) scaleX(0.001); opacity: 0; filter: brightness(5); }
}

/* --- ЭКРАН ВКЛЮЧЕНИЯ + BOOT SEQUENCE --- */
#start-screen { position: fixed; inset: 0; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; transition: opacity 0.5s; }
.power-btn { background: transparent; color: var(--green); border: 2px solid var(--green); padding: 15px 40px; font-size: 20px; font-family: inherit; cursor: pointer; letter-spacing: 2px; text-shadow: 0 0 5px var(--green); box-shadow: inset 0 0 10px rgba(140,255,156,0.1), 0 0 10px rgba(140,255,156,0.1); transition: all 0.2s; }
.power-btn:hover { background: var(--green); color: #000; box-shadow: 0 0 20px var(--green); }
.power-btn:active { transform: scale(0.95); }

#boot-sequence { display: none; color: var(--green); font-size: 14px; line-height: 1.8; text-align: left; width: 400px; }
#boot-sequence .boot-line { opacity: 0; animation: fadeInLine 0.3s forwards; }
@keyframes fadeInLine { to { opacity: 1; } }
#boot-sequence .ok { color: var(--bright); }

/* --- ОСНОВНОЙ ИНТЕРФЕЙС (ОС) --- */
.app{
  height:100%;
  display:grid;
  grid-template-columns:260px 1fr;
  gap:0;
  padding:22px;
  background: 
    radial-gradient(circle at 15% 20%, rgba(20, 100, 40, 0.15) 0%, transparent 40%),
    radial-gradient(circle at 85% 80%, rgba(10, 80, 30, 0.12) 0%, transparent 45%),
    radial-gradient(ellipse at 48% 42%, #0b1d0e 0, #020603 62%, #000 100%);
  opacity:0;
  pointer-events:none;
  transition:opacity 0.5s;
  position: relative;
}
.app.on { opacity: 1; pointer-events: auto; }

/* CRT-эффект с сеткой и сканлайнами */
body:before {
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background: 
    repeating-linear-gradient(to bottom, rgba(255,255,255,.025) 0, rgba(255,255,255,.025) 1px, transparent 1px, transparent 4px),
    repeating-linear-gradient(to right, rgba(140,255,156,0.015) 0, rgba(140,255,156,0.015) 1px, transparent 1px, transparent 60px);
  mix-blend-mode:screen;
  z-index:5;
  opacity:.35;
}
body:after {
  content:"";
  position:fixed;
  inset:-20%;
  pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.68) 100%);
  z-index:6;
}

/* Плавающие частицы */
.particles {
  position: fixed;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  overflow: hidden;
}
.particle {
  position: absolute;
  width: 2px;
  height: 2px;
  background: rgba(140, 255, 156, 0.4);
  border-radius: 50%;
  box-shadow: 0 0 6px rgba(140, 255, 156, 0.6);
  animation: float linear infinite;
}
@keyframes float {
  0% { transform: translateY(100vh) translateX(0); opacity: 0; }
  10% { opacity: 1; }
  90% { opacity: 1; }
  100% { transform: translateY(-10vh) translateX(30px); opacity: 0; }
}

.sidebar,.terminal{border:1px solid var(--line);background:rgba(3,10,5,.85);box-shadow:0 0 24px rgba(45,255,75,.07),inset 0 0 22px rgba(45,255,75,.035); backdrop-filter: blur(2px);}
.sidebar{border-right:0;padding:18px 14px;display:flex;flex-direction:column;min-height:0;position:relative;z-index:7}
.terminal{min-width:0;display:flex;flex-direction:column;position:relative;z-index:7; overflow:hidden;}

.brand{font-size:15px;color:var(--bright);letter-spacing:1px;margin-bottom:5px;text-shadow:0 0 8px rgba(140,255,156,.65)}
.status{color:var(--dim);font-size:11px;padding-bottom:17px;border-bottom:1px dashed var(--line);line-height:1.55}

.path-nav { display: flex; flex-direction: column; gap: 5px; margin-top: 15px; font-size: 12px; }
.path-btn { background: transparent; border: 1px solid var(--line); color: var(--green); text-align: left; padding: 6px 8px; cursor: pointer; font-family: inherit;}
.path-btn:hover { border-color: var(--green); background: rgba(140,255,156,0.1); }

.sidebar-bottom{margin-top:auto;padding-top:15px;border-top:1px dashed var(--line);font-size:10px;color:var(--dim);line-height:1.7}
.power-off-btn { display: block; width: 100%; margin-top: 10px; background: transparent; border: 1px solid #ff5555; color: #ff5555; padding: 8px; font-family: inherit; cursor: pointer; text-transform: uppercase; font-size: 11px; letter-spacing: 1px;}
.power-off-btn:hover { background: #ff5555; color: #000; box-shadow: 0 0 10px #ff5555; }

/* --- РАБОЧИЙ СТОЛ --- */
.topbar{height:46px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 16px;color:var(--dim);font-size:11px;flex:0 0 auto; gap: 10px; background: rgba(3,10,5,0.5);}
.dots{display:flex;gap:6px}.dot{width:8px;height:8px;border-radius:50%;border:1px solid var(--dim)}.dot:nth-child(2){border-color:var(--amber)}.dot:nth-child(3){border-color:var(--green)}
#path{color:var(--green);opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px;}

.desktop { 
  position: relative; 
  overflow: hidden; 
  flex: 1; 
  width: 100%; 
  height: 100%; 
  background: 
    radial-gradient(circle at 50% 50%, rgba(20, 90, 40, 0.15) 0%, transparent 70%),
    linear-gradient(135deg, rgba(5, 20, 10, 0.6) 0%, rgba(0, 0, 0, 0.9) 100%);
}
.desktop::-webkit-scrollbar{width:7px}.desktop::-webkit-scrollbar-thumb{background:#205a2a}

.desktop-icon { display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: grab; padding: 10px; border: 1px solid transparent; user-select: none; position: absolute; width: 100px; text-align: center; border-radius: 4px;}
.desktop-icon:active { cursor: grabbing; }
.desktop-icon:hover { background: rgba(140,255,156,0.1); border-color: var(--line); box-shadow: 0 0 15px rgba(140,255,156,0.15); }
.desktop-icon .icon-img { font-size: 40px; margin-bottom: 8px; text-shadow: 0 0 10px rgba(140,255,156,0.3); }
.desktop-icon .icon-label { font-size: 12px; color: var(--bright); word-break: break-word; }

/* --- РЕДАКТОР / ИИ-ИНТЕРФЕЙС --- */
.editor-view { display: none; flex-direction: column; height: 100%; width: 100%; position: absolute; inset: 0; background: rgba(3,10,5,0.98); z-index: 10;}
.editor-view.active { display: flex; }
.content{padding:25px 34px 30px;overflow-y:scroll;scroll-behavior:smooth;flex:1;min-height:0;height:0;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.content::-webkit-scrollbar{width:7px}.content::-webkit-scrollbar-thumb{background:#205a2a}

.system-prompt {color: var(--amber); font-size: 14px; margin-bottom: 22px; user-select:none;}
.system-prompt span {color: var(--green);}
h1{font-size:clamp(23px,4vw,42px);font-weight:400;letter-spacing:2px;color:var(--bright);margin:0 0 20px;text-shadow:0 0 12px rgba(140,255,156,.45)}
h2{font-size:15px;color:var(--amber);font-weight:400;margin:28px 0 10px}
p,li{max-width:780px;color:#8fc699;font-size:14px;line-height:1.85}ul{padding-left:22px}.meta{font-size:11px;color:var(--dim);margin-bottom:25px}.rule{height:1px;background:linear-gradient(90deg,var(--line),transparent);margin:22px 0}
pre{color:#79d886;font-size:13px;line-height:1.55;border-left:2px solid var(--line);padding:12px 15px;background:rgba(20,65,27,.12);overflow:auto;max-width:850px}
.content{--text-size:14px;color:var(--text-color)}.content p,.content li{font-size:var(--text-size)}.content pre{font-size:calc(var(--text-size) - 1px)}.content h1{font-size:clamp(23px,calc(var(--text-size) * 2.8),42px)}.content h2{font-size:calc(var(--text-size) + 1px)}

.footer{border-top:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;color:var(--dim);font-size:11px;flex:0 0 auto; background: var(--panel);} 
.nav button,.add{font:inherit;color:var(--green);background:transparent;border:1px solid var(--line);padding:6px 10px;cursor:pointer}.nav button:hover,.add:hover{border-color:var(--green);color:var(--bright);box-shadow:0 0 8px rgba(140,255,156,.2)}
.controls{display:flex;align-items:center;gap:5px;margin-left:auto;margin-right:16px}.controls button{font:inherit;font-size:11px;color:var(--green);background:transparent;border:1px solid var(--line);padding:3px 6px;cursor:pointer}.controls button:hover{border-color:var(--green);color:var(--bright)}.size-label{min-width:38px;text-align:center;color:var(--dim);font-size:10px}.color-picker{display:flex;align-items:center;gap:4px;color:var(--dim);font-size:10px;margin-left:5px}.color-picker input{width:25px;height:20px;padding:0;border:1px solid var(--line);background:transparent;cursor:pointer}
.cursor{display:inline-block;width:8px;height:14px;background:var(--green);vertical-align:-2px;animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
@media(max-width:800px){.app{grid-template-columns:1fr;padding:8px}.sidebar{display:none}.content{padding:22px 18px}.footer{font-size:10px}}

/* Стили для блока ответа ИИ */
#aiResponse { color: var(--green) !important; }
#aiResponse b { color: var(--bright); }
</style>
</head>
<body>

<!-- Частицы на фоне -->
<div class="particles" id="particles"></div>

<!-- Экран включения -->
<div id="start-screen">
  <div id="power-ui">
    <div style="color:var(--dim); font-size:12px; margin-bottom:20px; letter-spacing:2px; text-align:center;">ARCHIVE TERMINAL OS v1.0</div>
    <button class="power-btn" id="powerOnBtn">ВКЛЮЧИТЬ ТЕРМИНАЛ</button>
  </div>
  <div id="boot-sequence"></div>
</div>

<div id="screen-flash"></div>
<div id="crt-overlay"><div id="crt-line"></div></div>

<!-- Основное приложение -->
<div class="app" id="app">
  <aside class="sidebar">
    <div class="brand">/ / ARCHIVE_OS</div>
    <div class="status">LOCAL SESSION<br>STATUS: <span style="color:var(--green)">ONLINE</span></div>
    <div class="path-nav" id="pathNav"></div>
    <div class="sidebar-bottom">
      <button class="add" id="addItemBtn" style="width:100%; margin-bottom:10px;">+ СОЗДАТЬ</button>
      <button class="power-off-btn" id="powerOffBtn">ВЫКЛЮЧИТЬ ТЕРМИНАЛ</button>
    </div>
  </aside>
  
  <main class="terminal">
    <!-- Рабочий стол -->
    <div id="desktopView" style="display:flex; flex-direction:column; height:100%; width:100%;">
      <div class="topbar">
        <div class="dots"><i class="dot"></i><i class="dot"></i><i class="dot"></i></div>
        <div id="path">/home/desktop</div>
        <div>TTY: 01</div>
      </div>
      <div class="desktop" id="desktopGrid"></div>
    </div>

    <!-- Редактор / Anomaly.ai -->
    <div id="editorView" class="editor-view">
      <div class="topbar">
        <div class="dots"><i class="dot"></i><i class="dot"></i><i class="dot"></i></div>
        <div id="editorPath">/home/desktop/file.txt</div>
        <div class="controls" id="editorControls">
          <button id="closeEditorBtn" style="color:#ff5555; border-color:#ff5555; margin-right:10px;">[ ЗАКРЫТЬ ]</button>
          <button id="addH1" type="button" title="Добавить заголовок">+ H1</button>
          <button id="addH2" type="button" title="Добавить подзаголовок">+ H2</button>
          <button id="delH1" type="button" title="Удалить заголовок">− H1</button>
          <button id="delH2" type="button" title="Удалить подзаголовок">− H2</button>
          <span style="margin:0 5px;color:var(--line)">|</span>
          <button id="fontDown" type="button" title="Уменьшить шрифт">A−</button>
          <span class="size-label" id="fontSizeLabel">14px</span>
          <button id="fontUp" type="button" title="Увеличить шрифт">A+</button>
          <label class="color-picker" title="Цвет текста"><span>COLOR</span><input id="textColor" type="color" value="#8fc699"></label>
        </div>
        <div id="editorModeLabel">EDITOR</div>
      </div>
      
      <article class="content" id="content" tabindex="0" contenteditable="true" spellcheck="false"></article>
      
      <div class="footer">
        <span id="counter">FILE: </span>
        <div class="nav" id="footerNav">
          <button id="saveBtn" type="button">[ СОХРАНИТЬ ]</button>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
// --- ГЕНЕРАЦИЯ ЧАСТИЦ ---
(function generateParticles() {
  var container = document.getElementById('particles');
  if (!container) return;
  var count = 40;
  for (var i = 0; i < count; i++) {
    var p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random() * 100 + '%';
    p.style.animationDuration = (10 + Math.random() * 20) + 's';
    p.style.animationDelay = (Math.random() * 20) + 's';
    p.style.opacity = 0.2 + Math.random() * 0.6;
    var size = 1 + Math.random() * 2;
    p.style.width = size + 'px';
    p.style.height = size + 'px';
    container.appendChild(p);
  }
})();

// --- СТРУКТУРА ДАННЫХ ---
var defaultData = {
  name: "root",
  isFolder: true,
  children: [
    {
      name: "Documents",
      isFolder: true,
      children: [
        { name: "welcome.txt", isFolder: false, body: '<h1>WELCOME TO ARCHIVE_OS<span class="cursor"></span></h1><div class="meta">SYSTEM DOCUMENT</div><div class="rule"></div><p>Это твой личный терминал. Теперь это полноценная операционная система в стиле ретро.</p><p>Двойной клик по папке заходит внутрь. Двойной клик по файлу открывает его для редактирования.</p><h2>УПРАВЛЕНИЕ</h2><pre>Двойной клик — Открыть / Войти\nКнопка + СОЗДАТЬ — Создать папку или файл\nКнопка ЗАКРЫТЬ — Вернуться на рабочий стол\nПравый клик — Удалить (в корзину)</pre><p style="color:var(--dim)">SYSTEM READY_</p>' },
        { name: "about.txt", isFolder: false, body: '<h1>ABOUT</h1><div class="rule"></div><p>Это автономный файл. Работает локально без интернета.</p>' }
      ]
    },
    {
      name: "anomaly.ai",
      isFolder: false,
      isAI: true,
      body: '<h1>ANOMALY.AI</h1><div class="meta">VIRTUAL ASSISTANT // BETA</div><div class="rule"></div><p>Привет. Я Anomaly.ai. Я умею считать, искать в Википедии, Fandom, читать твои файлы и поддерживать живой диалог.</p><p>Напиши что-нибудь в строке ниже и нажми Enter. Например: <b>2+2</b>, <b>что такое вода</b>, <b>перескажи welcome.txt</b> или просто <b>привет</b>.</p><div style="margin-top:20px; display:flex; gap:10px;"><input type="text" id="aiInput" placeholder="Напиши мне что-нибудь..." style="flex:1; background:transparent; border:1px solid var(--line); color:var(--green); padding:10px; font-family:inherit; outline:none;" onkeydown="if(event.key===\'Enter\') askAnomaly()"><button onclick="askAnomaly()" style="background:transparent; border:1px solid var(--green); color:var(--green); padding:10px 20px; cursor:pointer; font-family:inherit;">СПРОСИТЬ</button></div><div id="aiResponse" style="margin-top:20px; padding:15px; border-left:2px solid var(--amber); background:rgba(213,196,119,0.05); display:none;"></div>' },
    {
      name: "Projects",
      isFolder: true,
      children: [
         { name: "ideas.txt", isFolder: false, body: '<h1>IDEAS</h1><div class="rule"></div><p>Здесь можно хранить планы на будущее.</p>' }
      ]
    },
    {
      name: "_TRASH",
      isFolder: true,
      isTrash: true,
      children: []
    }
  ]
};

var treeData = null;
var activeFile = null;
var currentPath = [];
var STORAGE_KEY='retroTerminalTree';

function loadData() {
  var saved = localStorage.getItem(STORAGE_KEY);
  if (saved) {
    try { treeData = JSON.parse(saved); } catch(e) { treeData = JSON.parse(JSON.stringify(defaultData)); }
  } else {
    treeData = JSON.parse(JSON.stringify(defaultData));
  }
  
  var hasAI = treeData.children.some(function(c) { return c.isAI; });
  if (!hasAI) {
    treeData.children.push({
      name: "anomaly.ai",
      isFolder: false,
      isAI: true,
      body: '<h1>ANOMALY.AI</h1><div class="meta">VIRTUAL ASSISTANT // BETA</div><div class="rule"></div><p>Привет. Я Anomaly.ai. Я умею считать, искать в Википедии, Fandom, читать твои файлы и поддерживать живой диалог.</p><p>Напиши что-нибудь в строке ниже и нажми Enter. Например: <b>2+2</b>, <b>что такое вода</b>, <b>перескажи welcome.txt</b> или просто <b>привет</b>.</p><div style="margin-top:20px; display:flex; gap:10px;"><input type="text" id="aiInput" placeholder="Напиши мне что-нибудь..." style="flex:1; background:transparent; border:1px solid var(--line); color:var(--green); padding:10px; font-family:inherit; outline:none;" onkeydown="if(event.key===\'Enter\') askAnomaly()"><button onclick="askAnomaly()" style="background:transparent; border:1px solid var(--green); color:var(--green); padding:10px 20px; cursor:pointer; font-family:inherit;">СПРОСИТЬ</button></div><div id="aiResponse" style="margin-top:20px; padding:15px; border-left:2px solid var(--amber); background:rgba(213,196,119,0.05); display:none;"></div>',
      x: 300,
      y: 30
    });
    saveAll();
  }
  
  initPositions(treeData);
}
loadData();

function initPositions(node) {
  if(node.children) {
    node.children.forEach(function(child, index) {
      if(child.x === undefined) {
        child.x = 30 + (index % 5) * 120;
        child.y = 30 + Math.floor(index / 5) * 120;
      }
      initPositions(child);
    });
  }
}

var desktopGrid = document.getElementById('desktopGrid');
var desktopView = document.getElementById('desktopView');
var editorView = document.getElementById('editorView');
var pathEl = document.getElementById('path');
var editorPath = document.getElementById('editorPath');
var counter = document.getElementById('counter');
var pathNav = document.getElementById('pathNav');
var content = document.getElementById('content');
var fontSizeLabel = document.getElementById('fontSizeLabel');
var textColorInput = document.getElementById('textColor');
var editorControls = document.getElementById('editorControls');
var editorModeLabel = document.getElementById('editorModeLabel');
var footerNav = document.getElementById('footerNav');
var textSize = parseInt(localStorage.getItem('retroTerminalFontSize'),10)||14;

// Контекст диалога
var lastBotQuestion = null;
var pendingFileSearch = null; // Для хранения списка найденных файлов

function saveAll(){
  if(activeFile && content && !activeFile.isAI){
    var clone = content.cloneNode(true);
    var sp = clone.querySelector('.system-prompt');
    if(sp) sp.remove();
    activeFile.body = clone.innerHTML;
  }
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(treeData));
    localStorage.setItem('retroTerminalFontSize', String(textSize));
  }catch(e){ console.log('save error',e); }
}

function getCurrentFolder() {
  var current = treeData;
  for(var i=0; i<currentPath.length; i++) {
    var found = current.children.find(function(c) { return c.isFolder && c.name === currentPath[i]; });
    if (found) current = found;
    else return treeData;
  }
  return current;
}

// --- ВСТРОЕННЫЙ КАЛЬКУЛЯТОР ---
function tryCalculate(query) {
  var clean = query.replace(/\s+/g, '');
  if (!/^[0-9+\-*/().]+$/.test(clean)) return null;
  if (!/[+\-*/]/.test(clean)) return null;
  try {
    var result = new Function('return ' + clean)();
    if (typeof result === 'number' && !isNaN(result) && isFinite(result)) return result;
  } catch(e) { return null; }
  return null;
}

// --- ПОИСК ФАЙЛОВ В ДЕРЕВЕ ---
function findFilesByName(query) {
  var results = [];
  var lowerQuery = query.toLowerCase().trim();
  
  function traverse(node, path) {
    if (node.isFolder) {
      if (node.children) {
        node.children.forEach(function(child) {
          traverse(child, path + '/' + node.name);
        });
      }
    } else {
      if (node.name.toLowerCase().indexOf(lowerQuery) !== -1) {
        results.push({
          node: node,
          path: path + '/' + node.name
        });
      }
    }
  }
  
  if (treeData.children) {
    treeData.children.forEach(function(child) {
      traverse(child, '');
    });
  }
  
  return results;
}

// --- ОЧИСТКА HTML ДЛЯ ПЕРЕСКАЗА ---
function stripHtml(html) {
  var tmp = document.createElement('div');
  tmp.innerHTML = html;
  return tmp.textContent || tmp.innerText || '';
}

// --- ОБРАБОТКА ЗАПРОСА "ПЕРЕСКАЖИ ФАЙЛ" ---
function handleFileReadRequest(rawQuery, responseDiv, input) {
  var readPatterns = /(перескажи|расскажи|что\s+в|что\s+написано|прочитай|открой|покажи)\s+(файл\s+)?(.+)/i;
  var match = rawQuery.match(readPatterns);
  
  if (!match) return false;
  
  var fileName = match[3].trim();
  fileName = fileName.replace(/["'«»]/g, '');
  
  var foundFiles = findFilesByName(fileName);
  
  if (foundFiles.length === 0) {
    responseDiv.innerHTML = '<span style="color:var(--amber);">ANOMALY.AI // ' + rawQuery + '</span><br><br>' +
      'Я не нашёл файлов с названием, содержащим "<b>' + fileName + '</b>". Попробуй уточнить название.';
    input.value = '';
    return true;
  }
  
  if (foundFiles.length === 1) {
    var file = foundFiles[0];
    var textContent = stripHtml(file.node.body);
    var preview = textContent.substring(0, 500);
    
    responseDiv.innerHTML = '<span style="color:var(--amber);">ANOMALY.AI // ' + rawQuery + '</span><br><br>' +
      '<b>Файл:</b> ' + file.path + '<br><br>' +
      '<b>Краткий пересказ:</b><br>' + preview + (textContent.length > 500 ? '...' : '');
    input.value = '';
    return true;
  }
  
  var listHtml = '<span style="color:var(--amber);">ANOMALY.AI // ' + rawQuery + '</span><br><br>' +
    'Я нашёл несколько файлов с похожими названиями. Уточни, какой именно тебе нужен:<br><br><ul>';
  
  foundFiles.forEach(function(f) {
    listHtml += '<li><b>' + f.path + '</b></li>';
  });
  listHtml += '</ul>Напиши полный путь к нужному файлу.';
  
  responseDiv.innerHTML = listHtml;
  pendingFileSearch = foundFiles;
  input.value = '';
  return true;
}

// --- ПРОВЕРКА НА ВЫБОР ФАЙЛА ИЗ СПИСКА ---
function handlePendingFileSelection(rawQuery, responseDiv, input) {
  if (!pendingFileSearch) return false;
  
  var queryLower = rawQuery.toLowerCase().trim();
  
  var matched = null;
  for (var i = 0; i < pendingFileSearch.length; i++) {
    var f = pendingFileSearch[i];
    if (f.path.toLowerCase().indexOf(queryLower) !== -1 || 
        f.node.name.toLowerCase().indexOf(queryLower) !== -1) {
      matched = f;
      break;
    }
  }
  
  if (matched) {
    var textContent = stripHtml(matched.node.body);
    var preview = textContent.substring(0, 500);
    
    responseDiv.innerHTML = '<span style="color:var(--amber);">ANOMALY.AI // ' + rawQuery + '</span><br><br>' +
      '<b>Файл:</b> ' + matched.path + '<br><br>' +
      '<b>Краткий пересказ:</b><br>' + preview + (textContent.length > 500 ? '...' : '');
    input.value = '';
    pendingFileSearch = null;
    return true;
  }
  
  responseDiv.innerHTML = '<span style="color:var(--amber);">ANOMALY.AI // ' + rawQuery + '</span><br><br>' +
    'Не могу найти файл с таким путём. Попробуй скопировать полный путь из списка выше.';
  input.value = '';
  return true;
}

// --- ФУНКЦИЯ ПОЛУЧЕНИЯ ОТВЕТА С УЧЁТОМ КОНТЕКСТА ---
function getSmartResponse(query) {
  var q = query.toLowerCase().trim().replace(/[!?.,]/g, '');
  
  if (lastBotQuestion === 'how_are_you') {
    if (HOW_ARE_YOU_RESPONSES[q]) {
      var resp = HOW_ARE_YOU_RESPONSES[q];
      lastBotQuestion = resp.followUp;
      return resp;
    }
  }
  
  if (lastBotQuestion && FOLLOW_UP_REACTIONS[q]) {
    var resp = FOLLOW_UP_REACTIONS[q];
    lastBotQuestion = resp.followUp;
    return resp;
  }
  
  if (DIRECT_RESPONSES[q]) {
    var resp = DIRECT_RESPONSES[q];
    lastBotQuestion = resp.followUp;
    return resp;
  }
  
  for (var key in DIRECT_RESPONSES) {
    if (q.indexOf(key) !== -1 && key.length > 3) {
      var resp = DIRECT_RESPONSES[key];
      lastBotQuestion = resp.followUp;
      return resp;
    }
  }
  
  for (var key in HOW_ARE_YOU_RESPONSES) {
    if (q.indexOf(key) !== -1 && key.length > 3) {
      var resp = HOW_ARE_YOU_RESPONSES[key];
      lastBotQuestion = resp.followUp;
      return resp;
    }
  }
  
  for (var key in FOLLOW_UP_REACTIONS) {
    if (q.indexOf(key) !== -1 && key.length > 3) {
      var resp = FOLLOW_UP_REACTIONS[key];
      lastBotQuestion = resp.followUp;
      return resp;
    }
  }
  
  return null;
}

// --- ГЛАВНАЯ ФУНКЦИЯ ---
function askAnomaly() {
  var input = document.getElementById('aiInput');
  var responseDiv = document.getElementById('aiResponse');
  if(!input || !responseDiv) return;
  
  var rawQuery = input.value.trim();
  if(!rawQuery) return;
  
  responseDiv.style.display = 'block';
  
  if (handlePendingFileSelection(rawQuery, responseDiv, input)) {
    return;
  }
  
  if (handleFileReadRequest(rawQuery, responseDiv, input)) {
    return;
  }
  
  var smartResp = getSmartResponse(rawQuery);
  if (smartResp) {
    var fullAnswer = smartResp.text;
    if (smartResp.followUp && FOLLOW_UP_QUESTIONS[smartResp.followUp]) {
      fullAnswer += '<br><br><span style="color:var(--bright);">' + FOLLOW_UP_QUESTIONS[smartResp.followUp] + '</span>';
    }
    responseDiv.innerHTML = '<span style="color:var(--amber);">ANOMALY.AI // ' + rawQuery + '</span><br><br>' + fullAnswer;
    input.value = '';
    return;
  }
  
  responseDiv.innerHTML = '<span style="color:var(--dim)">ANOMALY.AI обрабатывает...</span>';
  var calcResult = tryCalculate(rawQuery);
  if (calcResult !== null) {
    setTimeout(function() {
      responseDiv.innerHTML = '<span style="color:var(--amber);">ANOMALY.AI // ' + rawQuery + '</span><br><br>' +
        '<b>РЕЗУЛЬТАТ:</b> ' + calcResult;
      input.value = '';
    }, 300);
    return;
  }
  
  var lowerQuery = rawQuery.toLowerCase();
  if (lowerQuery.indexOf('бабка алка') !== -1 || lowerQuery.indexOf('баба алла') !== -1 || lowerQuery.indexOf('аллка') !== -1 || lowerQuery.indexOf('бабка алла') !== -1) {
    searchFandomSpecific('Баба_Алла', 'uglyanimation', rawQuery, responseDiv, input);
    return;
  }
  
  searchWikipedia(rawQuery, responseDiv, input);
}

// --- ПОИСК В ВИКИПЕДИИ (с фолбэком в Fandom) ---
function searchWikipedia(rawQuery, responseDiv, input) {
  var cleanedQuery = rawQuery.toLowerCase()
    .replace(/^(что такое|что это|кто такой|кто такая|кто такие|почему|зачем|как|где|когда)\s+/i, '')
    .replace(/\?+$/, '')
    .replace(/\s+/g, ' ')
    .trim();
  
  responseDiv.innerHTML = '<span style="color:var(--dim)">ANOMALY.AI ищет в Википедии: "' + cleanedQuery + '"...</span>';
  
  var callbackName = 'wikiSearch_' + Math.floor(Math.random() * 1000000);
  
  window[callbackName] = function(data) {
    if (!data || !data.query || !data.query.search || data.query.search.length === 0) {
      delete window[callbackName];
      var firstWord = cleanedQuery.split(' ')[0];
      if (firstWord !== cleanedQuery) {
        searchWikipedia(firstWord, responseDiv, input);
      } else {
        searchFandom(rawQuery, responseDiv, input);
      }
      return;
    }
    
    var firstResult = data.query.search[0];
    var pageTitle = firstResult.title;
    
    if (firstResult.snippet && (firstResult.snippet.indexOf('фильм') !== -1 || firstResult.snippet.indexOf('песня') !== -1)) {
      for (var i = 0; i < data.query.search.length; i++) {
        var candidate = data.query.search[i];
        if (candidate.snippet && candidate.snippet.indexOf('фильм') === -1 && candidate.snippet.indexOf('песня') === -1) {
          firstResult = candidate;
          pageTitle = candidate.title;
          break;
        }
      }
    }
    
    var summaryCallback = 'wikiSummary_' + Math.floor(Math.random() * 1000000);
    window[summaryCallback] = function(summaryData) {
      var answer = '';
      var hasAnswer = false;
      
      if (summaryData && summaryData.query && summaryData.query.pages) {
        var pages = summaryData.query.pages;
        for (var pageId in pages) {
          var page = pages[pageId];
          if (page.extract) {
            answer = '<b>ИЗ ВИКИПЕДИИ (' + page.title + '):</b> ' + page.extract;
            hasAnswer = true;
            break;
          }
        }
      }
      
      if (!hasAnswer) {
        delete window[callbackName];
        delete window[summaryCallback];
        searchFandom(rawQuery, responseDiv, input);
        return;
      }
      
      responseDiv.innerHTML = '<span style="color:var(--amber);">ANOMALY.AI // ' + rawQuery + '</span><br><br>' + answer;
      input.value = '';
      
      delete window[callbackName];
      delete window[summaryCallback];
    };
    
    var summaryScript = document.createElement('script');
    summaryScript.src = 'https://ru.wikipedia.org/w/api.php?action=query&titles=' + encodeURIComponent(pageTitle) + '&prop=extracts&exintro=1&explaintext=1&format=json&callback=' + summaryCallback;
    document.body.appendChild(summaryScript);
  };
  
  var searchScript = document.createElement('script');
  searchScript.src = 'https://ru.wikipedia.org/w/api.php?action=query&list=search&srsearch=' + encodeURIComponent(cleanedQuery) + '&format=json&callback=' + callbackName;
  searchScript.onerror = function() {
    delete window[callbackName];
    if(searchScript) searchScript.remove();
    searchFandom(rawQuery, responseDiv, input);
  };
  
  document.body.appendChild(searchScript);
}

// --- ПОИСК В FANDOM (JSONP) ---
function searchFandom(rawQuery, responseDiv, input) {
  var cleanedQuery = rawQuery.toLowerCase()
    .replace(/^(что такое|что это|кто такой|кто такая|кто такие|почему|зачем|как|где|когда)\s+/i, '')
    .replace(/\?+$/, '')
    .replace(/\s+/g, ' ')
    .trim();
  
  responseDiv.innerHTML = '<span style="color:var(--dim)">ANOMALY.AI ищет в Fandom: "' + cleanedQuery + '"...</span>';
  
  var callbackName = 'fandomSearch_' + Math.floor(Math.random() * 1000000);
  
  window[callbackName] = function(data) {
    var answer = '';
    var hasAnswer = false;
    
    if (data && data.query && data.query.search && data.query.search.length > 0) {
      var firstResult = data.query.search[0];
      var pageTitle = firstResult.title;
      
      var summaryCallback = 'fandomSummary_' + Math.floor(Math.random() * 1000000);
      window[summaryCallback] = function(summaryData) {
        if (summaryData && summaryData.query && summaryData.query.pages) {
          var pages = summaryData.query.pages;
          for (var pageId in pages) {
            var page = pages[pageId];
            if (page.extract) {
              answer = '<b>ИЗ FANDOM (' + page.title + '):</b> ' + page.extract;
              hasAnswer = true;
              break;
            }
          }
        }
        
        if (!hasAnswer) {
          answer = 'Нашёл статью "' + pageTitle + '" в Fandom, но не смог загрузить описание.';
        }
        
        responseDiv.innerHTML = '<span style="color:var(--amber);">ANOMALY.AI // ' + rawQuery + '</span><br><br>' + answer;
        input.value = '';
        
        delete window[callbackName];
        delete window[summaryCallback];
      };
      
      var summaryScript = document.createElement('script');
      summaryScript.src = 'https://community.fandom.com/api.php?action=query&titles=' + encodeURIComponent(pageTitle) + '&prop=extracts&exintro=1&explaintext=1&format=json&callback=' + summaryCallback;
      document.body.appendChild(summaryScript);
      
    } else {
      delete window[callbackName];
      showGoogleFallback(rawQuery, responseDiv, input);
    }
  };
  
  var searchScript = document.createElement('script');
  searchScript.src = 'https://community.fandom.com/api.php?action=query&list=search&srsearch=' + encodeURIComponent(cleanedQuery) + '&format=json&callback=' + callbackName;
  searchScript.onerror = function() {
    delete window[callbackName];
    if(searchScript) searchScript.remove();
    showGoogleFallback(rawQuery, responseDiv, input);
  };
  
  document.body.appendChild(searchScript);
}

}

// --- ПЕРЕМЕЩЕНИЕ ИКОНОК ---
var dragTarget = null;
var dragStartX = 0, dragStartY = 0;
var iconStartX = 0, iconStartY = 0;
var hasMoved = false;

function setupDragAndDrop(div, item) {
  div.onmousedown = function(e) {
    if(e.button !== 0) return;
    e.preventDefault();
    
    dragTarget = div;
    dragStartX = e.clientX;
    dragStartY = e.clientY;
    iconStartX = item.x;
    iconStartY = item.y;
    hasMoved = false;
    
    div.style.zIndex = 1000;
    div.style.opacity = '0.7';
    
    document.addEventListener('mousemove', onMouseMove);
    document.addEventListener('mouseup', onMouseUp);
  };
  
  function onMouseMove(e) {
    if(!dragTarget) return;
    var dx = e.clientX - dragStartX;
    var dy = e.clientY - dragStartY;
    
    if(Math.abs(dx) > 5 || Math.abs(dy) > 5) hasMoved = true;
    
    var newX = iconStartX + dx;
    var newY = iconStartY + dy;
    var maxX = desktopGrid.clientWidth - 110;
    var maxY = desktopGrid.clientHeight - 110;
    newX = Math.max(0, Math.min(newX, maxX));
    newY = Math.max(0, Math.min(newY, maxY));
    
    div.style.left = newX + 'px';
    div.style.top = newY + 'px';
  }
  
  function onMouseUp(e) {
    if(!dragTarget) return;
    
    if(hasMoved) {
      var dx = e.clientX - dragStartX;
      var dy = e.clientY - dragStartY;
      var newX = iconStartX + dx;
      var newY = iconStartY + dy;
      var maxX = desktopGrid.clientWidth - 110;
      var maxY = desktopGrid.clientHeight - 110;
      newX = Math.max(0, Math.min(newX, maxX));
      newY = Math.max(0, Math.min(newY, maxY));
      
      item.x = newX;
      item.y = newY;
      saveAll();
    }
    
    dragTarget.style.zIndex = '';
    dragTarget.style.opacity = '1';
    dragTarget = null;
    
    document.removeEventListener('mousemove', onMouseMove);
    document.removeEventListener('mouseup', onMouseUp);
  }
}

// --- ОТРИСОВКА РАБОЧЕГО СТОЛА ---
function renderDesktop() {
  desktopGrid.innerHTML = '';
  var currentFolder = getCurrentFolder();
  var displayPath = "/home/desktop/" + currentPath.join('/');
  pathEl.textContent = displayPath;
  
  pathNav.innerHTML = '';
  var rootBtn = document.createElement('button');
  rootBtn.className = 'path-btn';
  rootBtn.textContent = '💻 Мой компьютер';
  rootBtn.onclick = function() { currentPath = []; renderDesktop(); };
  pathNav.appendChild(rootBtn);
  
  var accumPath = [];
  currentPath.forEach(function(folderName) {
    accumPath.push(folderName);
    var pathToThis = accumPath.slice();
    var btn = document.createElement('button');
    btn.className = 'path-btn';
    btn.innerHTML = '📁 ' + folderName;
    btn.onclick = function() { currentPath = pathToThis; renderDesktop(); };
    pathNav.appendChild(btn);
  });

  if(currentFolder.children) {
    currentFolder.children.forEach(function(item) {
      var div = document.createElement('div');
      div.className = 'desktop-icon';
      
      div.style.left = (item.x || 30) + 'px';
      div.style.top = (item.y || 30) + 'px';
      
      var icon = document.createElement('div');
      icon.className = 'icon-img';
      if(item.isFolder) {
        icon.textContent = item.isTrash ? '🗑️' : '📁';
      } else if(item.isAI) {
        icon.textContent = '🤖';
      } else {
        icon.textContent = '📄';
      }
      
      var label = document.createElement('div');
      label.className = 'icon-label';
      label.textContent = item.name;
      
      div.appendChild(icon);
      div.appendChild(label);
      
      setupDragAndDrop(div, item);
      
      div.ondblclick = function() {
        if(hasMoved) return;
        if(item.isFolder) {
          currentPath.push(item.name);
          renderDesktop();
        } else {
          openFile(item);
        }
      };
      
      div.oncontextmenu = function(e) {
        e.preventDefault();
        if(item.isTrash) {
          if(confirm('Очистить корзину навсегда?')) {
            item.children = [];
            renderDesktop();
            saveAll();
          }
          return;
        }
        
        if(confirm('Переместить "' + item.name + '" в корзину?')) {
          var trashFolder = treeData.children.find(function(c) { return c.isTrash; });
          if(trashFolder) {
            var idx = currentFolder.children.indexOf(item);
            if(idx > -1) currentFolder.children.splice(idx, 1);
            trashFolder.children.push(item);
          }
          renderDesktop();
          saveAll();
        }
      };
      
      desktopGrid.appendChild(div);
    });
  }
}

var audioCtx = null;
var ambientStarted = false;

function initAudio() {
  if (!audioCtx) {
    var AudioContext = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AudioContext();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function startAmbientSound() {
  var ctx = initAudio();
  if (ambientStarted) return; 
  try {
    var osc1 = ctx.createOscillator();
    var osc2 = ctx.createOscillator();
    var filter = ctx.createBiquadFilter();
    var gainNode = ctx.createGain();
    osc1.type = 'triangle'; osc1.frequency.value = 40; 
    osc2.type = 'sine'; osc2.frequency.value = 60;
    filter.type = 'lowpass'; filter.frequency.value = 100; 
    gainNode.gain.value = 0.08; 
    osc1.connect(filter); osc2.connect(filter);
    filter.connect(gainNode); gainNode.connect(ctx.destination);
    osc1.start(); osc2.start();
    ambientStarted = true;
  } catch(e) {}
}

function playClickSound() {
  var ctx = initAudio();
  if (!ctx) return;
  try {
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(1000, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(150, ctx.currentTime + 0.03);
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.04);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + 0.05);
  } catch(e) {}
}

document.addEventListener('click', function(e) {
  if (e.target.tagName === 'BUTTON' || e.target.closest('button') || e.target.closest('.desktop-icon')) {
    playClickSound();
  }
});

// --- ВКЛЮЧЕНИЕ / ВЫКЛЮЧЕНИЕ ---
var startScreen = document.getElementById('start-screen');
var powerUI = document.getElementById('power-ui');
var bootSeq = document.getElementById('boot-sequence');
var app = document.getElementById('app');
var crtOverlay = document.getElementById('crt-overlay');
var crtLine = document.getElementById('crt-line');
var flash = document.getElementById('screen-flash');

document.getElementById('powerOnBtn').onclick = function() {
  initAudio();
  startAmbientSound();
  
  powerUI.style.display = 'none';
  bootSeq.style.display = 'block';
  bootSeq.innerHTML = '';
  
  var bootLines = [
    "ARCHIVE BIOS v1.0",
    "Memory Test: 640K OK",
    "Detecting IDE drives...",
    "Mounting file system... OK",
    "Loading kernel... OK",
    "Starting ARCHIVE_OS..."
  ];
  
  var lineIndex = 0;
  function showNextLine() {
    if (lineIndex < bootLines.length) {
      var line = document.createElement('div');
      line.className = 'boot-line';
      line.textContent = bootLines[lineIndex];
      bootSeq.appendChild(line);
      lineIndex++;
      setTimeout(showNextLine, 400 + Math.random() * 300);
    } else {
      setTimeout(function() {
        startScreen.style.display = 'none';
        app.classList.add('on');
        
        crtOverlay.style.opacity = '1';
        crtLine.style.animation = 'turnOn 0.6s ease-out forwards';
        flash.style.animation = 'flash 0.6s ease-out';
        
        setTimeout(function() {
          crtOverlay.style.opacity = '0';
          crtLine.style.animation = '';
          flash.style.animation = '';
          crtOverlay.style.pointerEvents = 'none';
          
          currentPath = [];
          renderDesktop();
          desktopView.style.display = 'flex';
          editorView.classList.remove('active');
        }, 600);
      }, 500);
    }
  }
  showNextLine();
};

document.getElementById('powerOffBtn').onclick = function() {
  saveAll();
  crtOverlay.style.opacity = '1';
  crtLine.style.animation = 'turnOff 0.6s ease-in forwards';
  
  setTimeout(function() {
    app.classList.remove('on');
    setTimeout(function(){
       startScreen.style.display = 'flex';
       powerUI.style.display = 'block';
       bootSeq.style.display = 'none';
       crtOverlay.style.opacity = '0';
       crtLine.style.animation = '';
       desktopGrid.innerHTML = '';
       content.innerHTML = '';
       activeFile = null;
    }, 500);
  }, 600);
};
</script>
